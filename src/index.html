<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mapcrm</title>
    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/pmtiles.js"></script>
    <script src="/vendor/plugin-sql.js"></script>
    <script src="/vendor/plugin-dialog.js"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <nav id="tabs">
      <button class="tab-button" data-tab="crm">CRM</button>
      <button class="tab-button" data-tab="map">Map</button>
    </nav>

    <main>
      <section id="crm-panel" class="tab-panel">
        <div id="practices-list-view">
          <div class="toolbar">
            <h1>Practices</h1>
            <button id="add-practice-btn">Add Practice</button>
          </div>
          <table id="practices-table">
            <thead>
              <tr>
                <th>Practice</th>
                <th>Contact</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
              </tr>
            </thead>
            <tbody id="practices-tbody"></tbody>
          </table>
          <p id="practices-empty" class="empty-state" hidden>No practices yet. Add one to get started.</p>
        </div>

        <div id="practice-detail-view" hidden>
          <div class="detail-fields">
            <button type="button" id="back-to-list-btn">&larr; Back to Practices</button>
            <input type="hidden" id="detail-id" />
            <div class="field-grid">
              <label>
                Practice Name
                <input type="text" id="detail-name" required />
              </label>
              <label>
                Contact Name
                <input type="text" id="detail-contact-name" />
              </label>
              <label>
                Phone
                <input type="tel" id="detail-phone" />
              </label>
              <label>
                Email
                <input type="email" id="detail-email" />
              </label>
              <label>
                Address
                <input type="text" id="detail-address" />
              </label>
              <label>
                Notes
                <textarea id="detail-notes" rows="2"></textarea>
              </label>
            </div>
            <p id="detail-geocode-status" class="geocode-status"></p>
            <div class="detail-actions">
              <button type="button" id="detail-delete-btn" class="delete-btn">Delete</button>
              <button type="button" id="detail-save-btn">Save</button>
            </div>
          </div>
          <div id="detail-map"></div>
        </div>
      </section>

      <section id="map-panel" class="tab-panel">
        <div id="map"></div>
      </section>
    </main>

    <div id="practice-modal" class="modal" hidden>
      <div class="modal-content">
        <h2>Add Practice</h2>
        <form id="practice-form">
          <label>
            Practice Name
            <input type="text" id="practice-name" required />
          </label>
          <label>
            Contact Name
            <input type="text" id="practice-contact-name" />
          </label>
          <label>
            Phone
            <input type="tel" id="practice-phone" />
          </label>
          <label>
            Email
            <input type="email" id="practice-email" />
          </label>
          <label>
            Address
            <input type="text" id="practice-address" />
          </label>
          <label>
            Notes
            <textarea id="practice-notes" rows="3"></textarea>
          </label>
          <p id="practice-geocode-status" class="geocode-status"></p>
          <div class="modal-actions">
            <button type="button" id="practice-cancel-btn">Cancel</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
